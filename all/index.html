<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すぐ使える！かんたん韓国語｜全120フレーズ 音声ページ</title>
<meta name="description" content="松山商工会議所 おもてなし韓国語シートの音声ページ。タップするとネイティブの発音が聞けます。">
<meta name="theme-color" content="#F26B2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF914D;
    --orange-2: #FFA865;
    --orange-deep: #F26B2A;
    --orange-soft: #FFF3EA;
    --cream: #FFF8F3;
    --ink: #3A3843;
    --ink-sub: #6B6870;
    --hangul: #B5602F;
    --line: #F6E3D6;
    --shadow: 0 14px 32px -20px rgba(242,107,42,.45);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 88px; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Meiryo", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Hero ---------- */
  header.hero {
    position: relative; overflow: hidden; color: #fff; text-align: center;
    background: linear-gradient(135deg, #FFB071 0%, var(--orange) 45%, var(--orange-deep) 100%);
    padding: 40px 20px 78px; border-radius: 0 0 32px 32px;
  }
  header.hero::before, header.hero::after {
    content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.12); pointer-events: none;
  }
  header.hero::before { width: 320px; height: 320px; top: -140px; right: -90px; }
  header.hero::after  { width: 220px; height: 220px; bottom: -120px; left: -70px; }
  .eyebrow {
    position: relative; display: inline-block; margin: 0 0 14px; padding: 5px 14px; border-radius: 999px;
    background: rgba(255,255,255,.22); font-size: 13px; font-weight: 700; letter-spacing: .04em;
  }
  header h1 {
    position: relative; margin: 0; font-weight: 900; line-height: 1.2;
    font-size: clamp(30px, 8vw, 46px); text-shadow: 0 2px 14px rgba(160,60,10,.25);
  }
  header h1 small { display: block; font-size: .5em; font-weight: 700; margin-bottom: 4px; opacity: .95; }
  .how {
    position: relative; margin: 18px auto 0; max-width: 520px; font-size: 14px; line-height: 1.7;
    background: rgba(255,255,255,.18); border-radius: 16px; padding: 10px 14px; font-weight: 500;
  }

  /* ---------- Sticky nav ---------- */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,248,243,.92); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px; margin-top: -26px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    border-bottom: 1px solid var(--line);
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: 0 0 auto; text-decoration: none; color: var(--orange-deep); background: #fff;
    font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); box-shadow: 0 2px 8px -4px rgba(242,107,42,.35);
  }
  nav a:hover { background: var(--orange-soft); }

  /* ---------- Content ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 18px 14px 8px; }
  section.cat {
    background: #fff; border-radius: 24px; padding: 18px 16px 8px; margin-bottom: 18px;
    border: 1px solid #FBE6D8; box-shadow: var(--shadow);
  }
  .cat-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .cat-head h2 {
    margin: 0; min-width: 0; color: #fff; font-size: clamp(14px, 4vw, 17px); font-weight: 900; line-height: 1.3;
    background: linear-gradient(90deg, var(--orange), var(--orange-2)); padding: 7px 16px; border-radius: 999px;
    box-shadow: 0 6px 14px -8px rgba(255,145,77,.9);
  }
  .play-all {
    flex-shrink: 0; white-space: nowrap; cursor: pointer; font: inherit; font-weight: 900; font-size: 13px;
    color: var(--orange-deep); background: var(--orange-soft); border: 0; padding: 9px 14px; border-radius: 999px;
    transition: background .2s, color .2s;
  }
  .play-all:hover { background: #FFE6D5; }
  .play-all[aria-pressed="true"] { background: var(--orange-deep); color: #fff; }

  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    padding: 14px 6px; border-top: 1px dashed var(--line); border-radius: 14px;
    transition: background .2s, box-shadow .2s;
  }
  .cat-head + .row { border-top: 0; }
  .row:hover { background: #FFFAF6; }
  .row.target { background: var(--orange-soft); box-shadow: 0 0 0 3px rgba(255,145,77,.4); border-top-color: transparent; }
  .row.playing { background: var(--orange-soft); box-shadow: inset 4px 0 0 var(--orange-deep); border-top-color: transparent; }
  .txt { min-width: 0; cursor: pointer; }
  .kana {
    font-size: clamp(18px, 5vw, 24px); font-weight: 900; line-height: 1.3; letter-spacing: .01em;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .ja { color: var(--ink-sub); font-size: 14px; font-weight: 700; margin-top: 3px; }
  .ko {
    display: inline-block; margin-top: 6px; padding: 2px 10px; border-radius: 8px;
    background: var(--orange-soft); color: var(--hangul); font-size: 14px; font-weight: 500;
  }
  .note { color: var(--ink-sub); font-size: 12px; margin-top: 4px; }

  .btns { display: flex; align-items: center; gap: 6px; }
  .btn {
    width: 50px; height: 50px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
    background: linear-gradient(145deg, #FFA466, var(--orange-deep)); color: #fff;
    font: inherit; font-weight: 900; font-size: 19px; line-height: 1;
    display: grid; place-items: center;
    box-shadow: 0 10px 18px -10px rgba(242,107,42,.9);
    transition: transform .12s, box-shadow .2s;
  }
  .btn:hover { box-shadow: 0 12px 22px -10px rgba(242,107,42,1); }
  .btn:active { transform: scale(.93); }
  .btn.slow {
    width: auto; height: 36px; border-radius: 999px; padding: 0 10px;
    background: #fff; color: var(--orange-deep); border: 2px solid #FFD2B5;
    box-shadow: none; font-size: 12px; letter-spacing: -.02em; white-space: nowrap;
  }
  .btn.slow:hover { background: var(--orange-soft); }
  .btn:focus-visible, .play-all:focus-visible, nav a:focus-visible, .row .txt:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 2px;
  }
  .btn[disabled] { background: #ECE8E5; color: #A7A3A9; border-color: #ECE8E5; box-shadow: none; cursor: default; }

  /* ---------- Tips & footer ---------- */
  .tips {
    max-width: 760px; margin: 0 auto 18px; padding: 20px 22px; border-radius: 24px;
    background: #fff; border: 1px solid #FBE6D8; box-shadow: var(--shadow); font-size: 14px; line-height: 1.8;
  }
  .tips h3 { margin: 0 0 6px; font-size: 17px; color: var(--orange-deep); font-weight: 900; }
  .tips ul { margin: 0; padding-left: 1.2em; }
  .tips li::marker { color: var(--orange); }

  footer {
    position: relative; overflow: hidden; color: #fff; text-align: center;
    background: linear-gradient(135deg, #F7863F 0%, var(--orange-deep) 55%, #E8502A 100%);
    padding: 28px 20px 36px; margin-top: 4px; border-radius: 32px 32px 0 0;
  }
  footer .org { font-weight: 900; font-size: 15px; }
  footer .tel {
    display: inline-block; margin: 8px 0 4px; font-size: 26px; font-weight: 900; letter-spacing: .02em;
    color: #fff; text-decoration: none;
  }
  footer .more { margin-top: 10px; font-size: 14px; font-weight: 700; opacity: .95; }

  #banner {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 20; display: none; border: 0; cursor: pointer;
    background: var(--ink); color: #fff; font: inherit; font-weight: 900; font-size: 16px;
    padding: 14px 22px; border-radius: 999px; box-shadow: 0 12px 28px -8px rgba(0,0,0,.4);
    width: min(92vw, 420px);
  }
  #banner.show { display: block; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .row, .btn { transition: none; } }
</style>
</head>
<body>
<header class="hero">
  <p class="eyebrow">松山商工会議所 ・ おもてなし韓国語</p>
  <h1><small>接客＋シチュエーション別 全120フレーズ</small>すぐ使える！かんたん韓国語</h1>
  <div class="how">▶ を押すとネイティブの発音が流れます。「ゆっくり」は速度を落として再生します。</div>
</header>

<nav id="nav" aria-label="カテゴリ"></nav>
<main id="main"><p style="color:var(--ink-sub)">読み込み中…</p></main>

<div class="tips">
  <h3>発音のコツ</h3>
  <ul>
    <li>「ムニダ」の「ム」は口を閉じるだけで軽く言う</li>
    <li>小さい「ッ」や語尾の「プ」「ク」は息を止める感じで短く</li>
    <li>「〜ヨ」で終わると丁寧で柔らかい印象に</li>
    <li>ハングル部分は、韓国の方に指さして見せても伝わります</li>
  </ul>
</div>

<footer>
  <div class="org">お問い合わせ　松山商工会議所 総合企画部</div>
  <a class="tel" href="tel:0899414111">☎ 089-941-4111</a>
  <div class="more">もっと学びたい方は『みんなの接客韓国語講座』へ！</div>
</footer>

<button id="banner" type="button">▶ タップして聞く</button>

<script>
(() => {
  const audio = new Audio();
  audio.preload = "none";
  let queue = [];          // ids waiting to play (for "全部聞く")
  let queueBtn = null;     // play-all button currently active
  let rate = 1;

  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const src = id => `audio/${id}.mp3`;

  function setPlaying(id) {
    document.querySelectorAll(".row.playing").forEach(r => r.classList.remove("playing"));
    if (id) { const r = document.getElementById(id); if (r) r.classList.add("playing"); }
  }

  function play(id, speed = 1) {
    rate = speed;
    audio.src = src(id);
    audio.playbackRate = speed;
    if ("preservesPitch" in audio) audio.preservesPitch = true;
    setPlaying(id);
    return audio.play().catch(() => {});
  }

  function stopQueue() {
    queue = [];
    if (queueBtn) { queueBtn.setAttribute("aria-pressed", "false"); queueBtn.textContent = "▶ 全部聞く"; queueBtn = null; }
  }

  function playAll(catId, btn) {
    const ids = [...document.querySelectorAll(`#${catId} .row`)].map(r => r.id);
    if (queueBtn === btn) { stopQueue(); audio.pause(); setPlaying(null); return; }
    stopQueue();
    queueBtn = btn; btn.setAttribute("aria-pressed", "true"); btn.textContent = "■ 停止";
    queue = ids.slice(1);
    play(ids[0]);
  }

  audio.addEventListener("ended", () => {
    if (queue.length) { setTimeout(() => play(queue.shift(), 1), 700); }
    else { setPlaying(null); stopQueue(); }
  });
  audio.addEventListener("error", () => {
    const id = (audio.src.match(/([bs]p\d+)\.mp3/) || [])[1];
    if (id) markMissing(id);
    if (queue.length) play(queue.shift(), 1); else { setPlaying(null); stopQueue(); }
  });

  function markMissing(id) {
    const row = document.getElementById(id);
    if (!row) return;
    row.querySelectorAll(".btn").forEach(b => { b.disabled = true; });
    const t = $(".btn:not(.slow)", row); if (t) t.textContent = "…";
  }

  function render(data) {
    $("#nav").innerHTML = data.categories.map((c, i) =>
      `<a href="#${c.id}">${esc(c.title)}</a>`).join("");

    $("#main").innerHTML = data.categories.map((c, i) => `
      <section class="cat" id="${c.id}" aria-labelledby="${c.id}-h">
        <div class="cat-head">
          <h2 id="${c.id}-h">${esc(c.title)}</h2>
          <button class="play-all" type="button" data-cat="${c.id}" aria-pressed="false">▶ 全部聞く</button>
        </div>
        ${c.phrases.map(p => `
          <div class="row" id="${p.id}">
            <div class="txt" data-id="${p.id}">
              <div class="kana">${esc(p.kana)}</div>
              <div class="ja">${esc(p.ja)}</div>
              <div class="ko" lang="ko">${esc(p.ko)}</div>
              ${p.note ? `<div class="note">※${esc(p.note)}</div>` : ""}
            </div>
            <div class="btns">
              <button class="btn" type="button" data-id="${p.id}" aria-label="${esc(p.ja)} を再生">▶</button>
              <button class="btn slow" type="button" data-id="${p.id}" data-speed="0.7" aria-label="${esc(p.ja)} をゆっくり再生">ゆっくり</button>
            </div>
          </div>`).join("")}
      </section>`).join("");

    document.addEventListener("click", e => {
      const b = e.target.closest(".btn, .txt");
      if (b && b.dataset.id && !b.disabled) { stopQueue(); play(b.dataset.id, parseFloat(b.dataset.speed || "1")); return; }
      const all = e.target.closest(".play-all");
      if (all) playAll(all.dataset.cat, all);
    });

    // Probe which audio files exist so missing ones show as "準備中"
    data.categories.flatMap(c => c.phrases).forEach(p => {
      fetch(src(p.id), { method: "HEAD" }).then(r => { if (!r.ok) markMissing(p.id); }).catch(() => {});
    });

    handleHash();
  }

  // QR deep links: #c1〜#c6 (category) / #p01〜#p60 (single phrase)
  function handleHash() {
    const h = location.hash.slice(1);
    const el = h && document.getElementById(h);
    const banner = $("#banner");
    document.querySelectorAll(".row.target").forEach(r => r.classList.remove("target"));
    if (!el) { banner.classList.remove("show"); return; }
    if (el.classList.contains("row")) {
      el.classList.add("target");
      banner.textContent = "▶ タップして音声を聞く";
      banner.onclick = () => { banner.classList.remove("show"); stopQueue(); play(h); };
    } else {
      banner.textContent = "▶ タップして" + $("h2", el).textContent.trim().slice(2) + "を聞く";
      banner.onclick = () => { banner.classList.remove("show"); playAll(h, $(".play-all", el)); };
    }
    banner.classList.add("show");
    requestAnimationFrame(() => el.scrollIntoView({ block: el.classList.contains("row") ? "center" : "start" }));
  }
  window.addEventListener("hashchange", handleHash);

  fetch("phrases.json").then(r => r.json()).then(render).catch(() => {
    $("#main").innerHTML = '<p style="color:var(--ink-sub)">読み込みに失敗しました。ページを再読み込みしてください。</p>';
  });
})();
</script>
</body>
</html>
